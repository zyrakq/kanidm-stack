x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}
services:
  kanidmd:
    container_name: kanidmd
    image: kanidmd
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:latest AS sleep-stage
        RUN apk add --no-cache git build-base musl-dev bison
        RUN git clone https://anongit.hacktivis.me/git/utils-std.git /src
        WORKDIR /src
        RUN ./configure && make LDSTATIC=-static cmd/sleep

        FROM ${IMAGE:-kanidm/server:latest}
        COPY --from=sleep-stage /src/cmd/sleep /bin/sleep

        ENTRYPOINT ["/bin/sleep", "${START_DELAY}"]
        CMD [ "/sbin/kanidmd", "server"]
    logging: *default-logging
    restart: unless-stopped
    # restart: no
    # command: ["/sbin/kanidmd", "domain", "rename"]
    environment:
      START_DELAY: ${START_DELAY:-10}
      KANIDM_VERSION: ${KANIDM_VERSION:-2}
      KANIDM_LOG_LEVEL: ${KANIDM_LOG_LEVEL:-info}
      KANIDM_BINDADDRESS: ${KANIDM_BINDADDRESS:-[::]:8443}
      KANIDM_DOMAIN: ${KANIDM_DOMAIN:-localhost}
      KANIDM_ORIGIN: ${KANIDM_ORIGIN:-https://localhost:8443}
      KANIDM_DB_PATH: ${KANIDM_DB_PATH:-/data/kanidm.db}
      KANIDM_TLS_CHAIN: ${KANIDM_TLS_CHAIN}
      KANIDM_TLS_KEY: ${KANIDM_TLS_KEY}
    volumes:
      - kanidm-data:/data
    networks:
      - kanidm-network
    ports:
      - "8443:8443"
networks:
  kanidm-network:
    name: kanidm-network
    driver: bridge
volumes:
  kanidm-data:
    name: kanidm-data
    driver: local
